name: e2e

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Site to test"
        default: both
        type: choice
        options: [both, welland, ps1]
      seed:
        description: "Replay a previous run's board choice"
        default: ""
      on_dead:
        description: "What to do if the chosen board is dead"
        default: fail
        type: choice
        options: [fail, retry]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: uv run pytest tests/unit -v

  plan:
    # Which sites to test. This cannot be a job-level `if` on the matrix job:
    # the `matrix` context is not available when job-level `if` is evaluated.
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.pick.outputs.sites }}
    steps:
      - id: pick
        env:
          WANTED: ${{ inputs.site || 'both' }}
        run: |
          case "$WANTED" in
            welland) echo 'sites=["welland"]' >> "$GITHUB_OUTPUT" ;;
            ps1)     echo 'sites=["ps1"]'     >> "$GITHUB_OUTPUT" ;;
            *)       echo 'sites=["welland","ps1"]' >> "$GITHUB_OUTPUT" ;;
          esac

  shared:
    needs: [unit, plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    concurrency:
      group: e2e-${{ matrix.site }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - name: Install the browser and ffmpeg
        # ffmpeg is what --video recording needs; without it every test errors
        # at setup with "Executable doesn't exist at .../ffmpeg-linux".
        run: uv run playwright install --with-deps chromium ffmpeg
      - name: Run the suite against ${{ matrix.site }}
        run: |
          uv run pytest tests/shared -v -s \
            --site ${{ matrix.site }} \
            --on-dead ${{ inputs.on_dead || 'fail' }} \
            ${{ inputs.seed && format('--seed {0}', inputs.seed) || '' }} \
            --screenshot on --video retain-on-failure --tracing retain-on-failure \
            --output test-results
      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.site }}-${{ github.run_id }}
          path: test-results/
          retention-days: 14
